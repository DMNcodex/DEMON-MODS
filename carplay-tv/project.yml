name: DEMONCarPlayTV
options:
  bundleIdPrefix: com.demoncodex
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.0
    INFOPLIST_KEY_CFBundleDisplayName: DEMON CarPlay TV
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  DEMONCarPlayTV:
    type: application
    platform: iOS
    sources:
      - DEMONCarPlayTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demoncodex.carplaytv
        GENERATE_INFOPLIST_FILE: YES
