workflows:
  demon-carplay-ios:
    name: DEMON CarPlay TV - iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/carplay-tv"
          xcodegen generate
      - name: Build iOS app for device
        script: |
          cd "$CM_BUILD_DIR/carplay-tv"
          xcodebuild -project DEMONCarPlayTV.xcodeproj \
            -scheme DEMONCarPlayTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/carplay-tv/build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        script: |
          cd "$CM_BUILD_DIR/carplay-tv"
          mkdir -p unsigned/Payload
          cp -R build/Build/Products/Release-iphoneos/DEMONCarPlayTV.app unsigned/Payload/
          cd unsigned
          zip -qr "$CM_BUILD_DIR/DEMON_CarPlay_TV_UNSIGNED.ipa" Payload
          unzip -t "$CM_BUILD_DIR/DEMON_CarPlay_TV_UNSIGNED.ipa" | tail -n 2
    artifacts:
      - DEMON_CarPlay_TV_UNSIGNED.ipa
      - carplay-tv/build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
